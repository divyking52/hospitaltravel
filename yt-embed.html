<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>YouTube Embed</title>
<style>
  html, body { height: 100%; margin: 0; background: #0a1c28; overflow: hidden; }
  iframe { width: 100%; height: 100%; border: 0; display: block; }
</style>
</head>
<body>
<iframe
  id="player"
  title="YouTube video player"
  allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen"
  allowfullscreen
  referrerpolicy="strict-origin-when-cross-origin"
></iframe>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var id = params.get("v") || "";
  if (!/^[A-Za-z0-9_-]{6,20}$/.test(id)) {
    document.body.textContent = "Missing or invalid video id.";
    return;
  }
  var origin = location.origin && location.origin.indexOf("http") === 0
    ? location.origin
    : "https://www.youtube.com";
  var qs = new URLSearchParams({
    rel: "0",
    modestbranding: "1",
    playsinline: "1",
    autoplay: params.get("autoplay") === "1" ? "1" : "0",
    origin: origin,
    widget_referrer: origin
  });
  var player = document.getElementById("player");
  player.setAttribute("referrerpolicy", "strict-origin-when-cross-origin");
  player.referrerPolicy = "strict-origin-when-cross-origin";
  // Official embed host + referrer policy fixes Error 153.
  player.src = "https://www.youtube.com/embed/" + encodeURIComponent(id) + "?" + qs.toString();
})();
</script>
</body>
</html>
